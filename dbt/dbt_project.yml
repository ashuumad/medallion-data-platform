# ============================================================
# dbt/dbt_project.yml — Enterprise multi-environment config
# ============================================================

name: 'medallion'
version: '1.0.0'
config-version: 2

profile: 'medallion'

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# ── Model configurations ──────────────────────────────────────
models:
  medallion:

    # 🟤 Bronze — raw ingestion
    bronze:
      +materialized: table
      +schema: bronze          # becomes bronze_dev / bronze_qa / bronze_prod
      +tags: ['bronze']

    # ⚪ Silver — cleaned data
    silver:
      +materialized: table
      +schema: silver          # becomes silver_dev / silver_qa / silver_prod
      +tags: ['silver']

    # 🟡 Gold — business ready
    gold:
      +materialized: table
      +schema: gold            # becomes gold_dev / gold_qa / gold_prod
      +tags: ['gold']

# ── Seeds ─────────────────────────────────────────────────────
seeds:
  medallion:
    +schema: raw               # raw_dev / raw_qa / raw_prod
